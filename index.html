<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For. 이름</title>

<!-- 픽셀 느낌의 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   [수정하기 쉬운 설정]
   여기의 --accent 색상 하나만 바꾸면
   사이트 전체의 파란색 포인트가 변경돼.
   ========================================================= */

:root {
    --accent: #6da9e8;
    --accent-light: rgba(109, 169, 232, 0.16);
    --accent-faint: rgba(109, 169, 232, 0.08);

    --black: #111111;
    --white: #ffffff;

    --content-width: 720px;
}


/* =========================================================
   기본 설정
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--white);
}

body {
    width: 100%;
    min-height: 100vh;

    background: var(--white);
    color: var(--black);

    font-family: "Silkscreen", monospace;

    overflow-x: hidden;
}


/* =========================================================
   배경 파티클
   ========================================================= */

#snow-background {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    overflow: hidden;

    z-index: 0;
}


/* 개별 파티클 */

.snow {
    position: absolute;

    top: -20px;

    width: 3px;
    height: 3px;

    background: var(--accent);

    opacity: 0.18;

    filter: blur(0.4px);

    animation-name: snow-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}


/* 크기가 조금 큰 파티클 */

.snow.big {
    width: 5px;
    height: 5px;

    opacity: 0.11;

    filter: blur(1px);
}


/* 작은 파티클 */

.snow.small {
    width: 2px;
    height: 2px;

    opacity: 0.22;

    filter: blur(0.2px);
}


/* 눈이 떨어지는 움직임 */

@keyframes snow-fall {

    0% {
        transform:
            translate3d(0, -20px, 0)
            rotate(0deg);
    }

    25% {
        transform:
            translate3d(12px, 25vh, 0)
            rotate(90deg);
    }

    50% {
        transform:
            translate3d(-10px, 50vh, 0)
            rotate(180deg);
    }

    75% {
        transform:
            translate3d(15px, 75vh, 0)
            rotate(270deg);
    }

    100% {
        transform:
            translate3d(-5px, 110vh, 0)
            rotate(360deg);
    }
}


/* =========================================================
   전체 페이지
   ========================================================= */

#page {
    position: relative;

    z-index: 1;

    width: 100%;
    min-height: 100vh;
}


/* =========================================================
   입장 화면
   ========================================================= */

#intro-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--white);

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}


/* 입장 화면이 사라질 때 */

#intro-screen.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* 입장 화면 안쪽 */

.intro-inner {

    width: min(88%, 600px);

    text-align: center;

    padding: 40px 20px;
}


/* =========================================================
   입장 화면 상단 작은 장식
   ========================================================= */

.intro-decoration {

    display: inline-block;

    margin-bottom: 24px;

    color: var(--accent);

    font-size: 11px;

    letter-spacing: 3px;

    opacity: 0;

    animation: intro-up 0.8s ease forwards;
}


/* =========================================================
   For. 이름
   ========================================================= */

.intro-title {

    color: var(--black);

    font-size: clamp(25px, 6vw, 48px);

    line-height: 1.4;

    letter-spacing: 1px;

    margin-bottom: 14px;

    opacity: 0;

    animation:
        intro-up 0.8s ease 0.12s forwards;
}


/* 이름 강조 */

.intro-title .accent {

    color: var(--accent);
}


/* =========================================================
   By. LR. 리아
   ========================================================= */

.intro-by {

    color: var(--black);

    font-size: 10px;

    letter-spacing: 1px;

    margin-bottom: 28px;

    opacity: 0;

    animation:
        intro-up 0.8s ease 0.24s forwards;
}


/* =========================================================
   ~을 닮은 이름님을 위해.
   ========================================================= */

.intro-for {

    color: var(--black);

    font-size: 9px;

    line-height: 1.8;

    margin-bottom: 40px;

    opacity: 0;

    animation:
        intro-up 0.8s ease 0.36s forwards;
}


/* =========================================================
   이야기로 스며들기 버튼
   ========================================================= */

#enter-button {

    appearance: none;

    border: 1px solid var(--accent);

    border-radius: 0;

    background: var(--white);

    color: var(--accent);

    padding: 15px 22px;

    font-family: "Silkscreen", monospace;

    font-size: 10px;

    letter-spacing: 1px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;

    opacity: 0;

    animation:
        intro-up 0.8s ease 0.48s forwards;
}


/* 마우스를 올렸을 때 */

#enter-button:hover {

    background: var(--accent);

    color: var(--white);

    box-shadow:
        5px 5px 0 var(--accent-light);

    transform:
        translate(-2px, -2px);
}


/* 클릭할 때 */

#enter-button:active {

    transform:
        translate(0, 0);

    box-shadow: none;
}


/* =========================================================
   입장 화면 등장 애니메이션
   ========================================================= */

@keyframes intro-up {

    from {

        opacity: 0;

        transform:
            translateY(12px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   메인 콘텐츠
   처음에는 숨겨져 있다가 로딩 이후 나타남
   ========================================================= */

#main-content {

    width: 100%;

    min-height: 100vh;

    padding:
        70px 20px 50px;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
}


/* 메인 콘텐츠 표시 */

#main-content.show {

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   메인 콘텐츠 최대 너비
   ========================================================= */

.content-wrapper {

    width: 100%;

    max-width: var(--content-width);

    margin:
        0 auto;
}


/* =========================================================
   상단 페이지 헤더
   ========================================================= */

.page-header {

    width: 100%;

    margin-bottom: 45px;

    text-align: center;
}


/* 헤더의 작은 장식 */

.page-header-decoration {

    display: block;

    color: var(--accent);

    font-size: 9px;

    letter-spacing: 4px;

    margin-bottom: 14px;
}


/* 페이지 제목 */

.page-title {

    font-size: clamp(20px, 5vw, 34px);

    line-height: 1.5;

    margin-bottom: 10px;
}


/* 페이지 설명 */

.page-subtitle {

    font-size: 8px;

    line-height: 1.8;

    opacity: 0.6;
}


/* =========================================================
   로딩 화면
   ========================================================= */

#loading-screen {

    position: fixed;

    inset: 0;

    z-index: 90;

    display: flex;

    align-items: center;
    justify-content: center;

    background: var(--white);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.4s ease,
        visibility 0.4s ease;
}


/* 로딩 화면 활성화 */

#loading-screen.show {

    opacity: 1;

    visibility: visible;
}


/* 로딩 텍스트 */

.loading-text {

    color: var(--accent);

    font-size: 11px;

    letter-spacing: 2px;

    animation:
        loading-blink 1s steps(2, end) infinite;
}


@keyframes loading-blink {

    0% {
        opacity: 0.35;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.35;
    }
}


/* =========================================================
   카드 영역
   ========================================================= */

.cards-container {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 30px;
}


/* =========================================================
   카드 기본 틀
   ========================================================= */

.work-card {

    position: relative;

    width: 100%;

    aspect-ratio: 0.92 / 1;

    background: var(--white);

    border: 1px solid var(--accent);

    border-radius: 0;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    opacity: 0;

    transform:
        translateY(20px);

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}


/* 카드 등장 */

.work-card.visible {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   카드 배너
   비율 2 : 3 중 위쪽 2
   ========================================================= */

.card-banner {

    position: relative;

    width: 100%;

    flex: 2;

    min-height: 0;

    overflow: hidden;

    background: var(--accent-faint);

    border-bottom: 1px solid var(--accent);
}


/* 배너 이미지 */

.card-banner img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* =========================================================
   카드 본문
   비율 2 : 3 중 아래쪽 3
   ========================================================= */

.card-body {

    position: relative;

    width: 100%;

    flex: 3;

    min-height: 0;

    padding: 18px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}


/* =========================================================
   카드 본문 상단
   ========================================================= */

.card-info {

    width: 100%;
}


/* 카드 제목 */

.card-title {

    font-size: 12px;

    line-height: 1.7;

    margin-bottom: 10px;

    word-break: keep-all;
}


/* 작업일자 */

.card-date {

    font-size: 8px;

    line-height: 1.7;

    opacity: 0.55;
}


/* =========================================================
   카드 이동 버튼
   ========================================================= */

.card-link {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    align-self: flex-start;

    min-height: 34px;

    padding: 8px 12px;

    border: 1px solid var(--accent);

    border-radius: 0;

    background: var(--white);

    color: var(--accent);

    text-decoration: none;

    font-family: "Silkscreen", monospace;

    font-size: 8px;

    line-height: 1.4;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
}


.card-link:hover {

    background: var(--accent);

    color: var(--white);

    transform:
        translate(-2px, -2px);
}


/* =========================================================
   맨 아래 출처 영역
   ========================================================= */

.footer {

    width: 100%;

    margin-top: 60px;

    padding-top: 20px;

    border-top: 1px solid var(--accent);

    font-size: 8px;

    line-height: 2;

    opacity: 0.65;
}


/* =========================================================
   모바일
   ========================================================= */

@media (max-width: 600px) {

    #main-content {

        padding:
            55px 16px 35px;
    }


    .intro-inner {

        width: 92%;

        padding:
            30px 10px;
    }


    .cards-container {

        grid-template-columns:
            1fr;

        gap: 25px;
    }


    .work-card {

        aspect-ratio:
            0.95 / 1;
    }


    .card-body {

        padding: 16px;
    }


    .page-header {

        margin-bottom: 35px;
    }
}


/* =========================================================
   아주 작은 화면
   ========================================================= */

@media (max-width: 360px) {

    .intro-title {

        font-size: 23px;
    }


    .intro-by {

        font-size: 9px;
    }


    .intro-for {

        font-size: 8px;
    }


    #enter-button {

        font-size: 9px;

        padding:
            13px 17px;
    }


    .card-title {

        font-size: 11px;
    }
}

</style>

<script>

/*
=============================================================
  입장 버튼
=============================================================
*/

const enterButton =
    document.getElementById("enter-button");

const introScreen =
    document.getElementById("intro-screen");

const loadingScreen =
    document.getElementById("loading-screen");

const mainContent =
    document.getElementById("main-content");

const workCards =
    document.querySelectorAll(".work-card");


/*
=============================================================
  이야기로 스며들기
=============================================================

  버튼을 누르면

  1. 입장 화면이 사라짐
  2. 로딩 화면 등장
  3. 정확히 1.5초 동안 유지
  4. 로딩 화면이 사라짐
  5. 작업물 페이지 등장
  6. 카드가 순서대로 나타남

=============================================================
*/

enterButton.addEventListener("click", function () {


    /* ---------------------------------------------
       1. 입장 화면 숨기기
       --------------------------------------------- */

    introScreen.classList.add("hide");


    /* ---------------------------------------------
       2. 로딩 화면 표시
       --------------------------------------------- */

    loadingScreen.classList.add("show");


    /* ---------------------------------------------
       3. 1.5초 대기
       --------------------------------------------- */

    setTimeout(function () {


        /* -----------------------------------------
           4. 로딩 화면 숨기기
           ----------------------------------------- */

        loadingScreen.classList.remove("show");


        /* -----------------------------------------
           5. 메인 페이지 표시
           ----------------------------------------- */

        mainContent.classList.add("show");


        /* -----------------------------------------
           6. 카드 순차 등장
           ----------------------------------------- */

        workCards.forEach(function(card, index) {

            setTimeout(function() {

                card.classList.add("visible");

            }, 150 + (index * 130));

        });


    }, 1500);

});


/*
=============================================================
  이미지가 존재하지 않을 경우
=============================================================

  아직 이미지를 넣지 않았거나 파일명이 잘못됐을 때
  깨진 이미지 아이콘 대신 깔끔한 파란 영역으로
  보이도록 처리함.

  나중에 실제 a.png, b.png 등을 넣으면
  자동으로 정상 이미지가 표시됨.

=============================================================
*/

const bannerImages =
    document.querySelectorAll(".card-banner img");


bannerImages.forEach(function(image) {

    image.addEventListener("error", function() {

        image.style.display = "none";

        image.parentElement.classList.add(
            "image-missing"
        );

    });

});


/*
=============================================================
  카드 이미지 로딩 완료 효과
=============================================================
*/

bannerImages.forEach(function(image) {

    image.addEventListener("load", function() {

        image.classList.add("image-loaded");

    });

});


/*
=============================================================
  마우스가 카드 위에 올라갔을 때
=============================================================

  카드 자체는 라운드 없이 유지하면서
  아주 미세하게 떠오르는 느낌만 줌.

=============================================================
*/

workCards.forEach(function(card) {

    card.addEventListener("mouseenter", function() {

        card.style.transform =
            "translateY(-4px)";

    });


    card.addEventListener("mouseleave", function() {

        card.style.transform =
            "translateY(0)";

    });

});


/*
=============================================================
  키보드 접근성
=============================================================
*/

enterButton.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {

        event.preventDefault();

        enterButton.click();

    }

});


</script>


<style>

   이미지가 아직 없을 때의 표시
   ========================================================= */

.image-missing {

    display: flex;

    justify-content: center;

    background:
        var(--accent-faint);
}


/* 이미지가 없을 때 작은 표시 */

.image-missing::after {

    content: "[ IMAGE ]";

    color: var(--accent);

    font-family: "Silkscreen", monospace;

    font-size: 8px;

    letter-spacing: 2px;

    opacity: 0.45;
}


/* =========================================================
   이미지 로딩 후
   ========================================================= */

.card-banner img {

    opacity: 0;

    transition:
        opacity 0.5s ease;
}


.card-banner img.image-loaded {

    opacity: 1;
}


/* =========================================================
   카드에 마우스를 올렸을 때
   ========================================================= */

.work-card {

    transition:

        transform 0.25s ease,
        box-shadow 0.25s ease;

.work-card:hover {

    box-shadow:
        6px 6px 0 var(--accent-light);
}


/* =========================================================

   ========================================================= */

#enter-button:focus-visible {

    outline-offset:

}


/* =========================================================

   ========================================================= */

::selection {

    background:

    color:
        var(--white);
}


/* =========================================================
   모바일 카드 터치 효과
   ========================================================= */

@media (hover: none) {

    }

        transform: none;

}


/* =========================================================

@media (max-width: 300px) {

    }

    .card-date {

        font-size: 7px;

    }

    .card-link {

        font-size: 7px;

        padding:
            7px 9px;

    }

}

</style>


<!-- =========================================================
     페이지 끝
